# Runs the test suite and the code check on every push and pull request.
# Windows also builds and exercises the Agente-Canino.exe panel and the background scripts.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Pruebas
        if: runner.os == 'Linux'
        run: npm test
      # Two Windows tests start the bot in the background and drive the GUI panel. On GitHub's
      # hosted runners they exceed their time limits, so they run on the team's PCs instead;
      # the next step still checks that the panel compiles.
      - name: Pruebas
        if: runner.os == 'Windows'
        run: npm test -- --test-skip-pattern="^(EXE|Windows):"
      - name: Compilar el panel de Windows
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: powershell
        run: ./scripts/build-launcher.ps1 -OutputPath "$env:RUNNER_TEMP\Agente-Canino.exe"
      - name: Revisión de código y componentes
        run: npm run check
